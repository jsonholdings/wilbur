[project]
name = "wilbur"
version = "2.10.0"
description = "Local coding agent for the terminal, driven by Ollama models."
requires-python = ">=3.10"
dependencies = ["prompt_toolkit>=3.0.43"]

[project.optional-dependencies]
art = ["Pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
wilbur = "wilbur.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wilbur*"]
